spring.datasource.url=jdbc:postgresql://localhost:5432/db_pedidos
spring.datasource.username=postgres
spring.datasource.password=root
server.port=8080
# Let Flyway manage schema migrations
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database=POSTGRESQL
spring.datasource.platform=postgres
spring.jpa.show-sql=true
spring.mvc.throwExceptionIfNoHandlerFound=true
# Disable Spring's SQL initializer to avoid running data.sql on startup
spring.sql.init.mode=never
# Flyway settings (default locations include classpath:db/migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true